# Profilo di produzione per avvio veloce

# Database MongoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=warehouse

# Server
server.port=8080
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100

# Logging ridotto per performance
logging.level.root=WARN
logging.level.com.storage=INFO
logging.level.org.springframework=WARN
logging.level.org.mongodb=WARN

# Disabilita funzionalità non necessarie
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# Compressione
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Timeout ridotti
spring.data.mongodb.server-selection-timeout=2000
spring.data.mongodb.connect-timeout=2000
spring.data.mongodb.socket-timeout=2000

